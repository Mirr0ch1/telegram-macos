name: Build macOS app

# Builds Telegram for macOS on a GitHub-hosted macOS runner and uploads the .app as an
# artifact, so a change can be tried on a real Mac without a local checkout.
#
# This workflow lives in the fork only: the upstream repository does not accept changes to
# GitHub automation from contributor pull requests (see CONTRIBUTING.md).
on:
  push:
    branches:
      - build/macos-app
      - feature/rich-paste-preserve-composer-text
      - feature/rich-paste-editor-toggle
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Telegram for macOS (${{ matrix.os }})
    # The native libraries (WebRTC, ffmpeg, ...) are compiled from source; this takes a while.
    strategy:
      # The macOS runner pool is small and can be busy for a long time, and the arm64 capacity is
      # tight, so the build is offered on two images; whichever finishes first produces the artifact.
      # Both need the macOS 26 SDK (see the Xcode selection step).
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    env:
      # CMake 4 dropped support for the old cmake_minimum_required versions mozjpeg and td declare.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          # The submodules are fetched by the setup script below, which also applies the
          # source patches the newer toolchains need.
          submodules: false
          fetch-depth: 1

      - name: Use HTTPS for the submodule URLs
        # The submodules are declared with SSH URLs; the runner has no SSH key, so the URLs
        # are rewritten to HTTPS.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"

      - name: Select the Xcode version to build with
        # The NEWEST Xcode on the image, not the default one: upstream's TGUIKit uses
        # NSGlassEffectView, which needs the macOS 26 SDK, and the image's default Xcode may still
        # be an older one (16.4 on macos-15) that cannot compile it.
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then
            NEWEST=/Applications/Xcode.app
          fi
          echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          # Fail right away on an image whose newest Xcode is too old, instead of after the native
          # libraries have been compiled for half an hour.
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/.*Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "Xcode $MAJOR is too old: the project needs the macOS 26 SDK" >&2
            exit 1
          fi

      - name: Install the build dependencies
        # `scripts/setup_build_env.sh` installs `openssl@1.1` from Homebrew, which Homebrew has
        # since removed. The project builds its own OpenSSL 1.1.1 from
        # `core-xprojects/openssl/OpenSSLEncryption`, so the brew package is not needed here.
        run: |
          set -euo pipefail
          brew install cmake ninja meson nasm yasm zlib autoconf libtool automake pkg-config
          if [ "$(uname -m)" = "arm64" ]; then
            arch -x86_64 /usr/bin/true >/dev/null 2>&1 || softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Initialise the git submodules
        # The submodules have nested submodules of their own (telegram-ios carries tdlib/td and
        # the wallet engine), and the native libraries build from those sources — a missing one
        # leaves the build configuring an empty source directory.
        run: |
          git submodule update --init --recursive
          git -C submodules/telegram-ios submodule update --init --recursive

      - name: Cache the Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: rust-${{ runner.os }}-${{ hashFiles('submodules/telegram-ios/third-party/wallet-engine/wallet-engine/rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install the Rust toolchain
        # The wallet engine and the MTProto engine are Rust libraries.
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Patch the sources for the current toolchain
        # Recent clang hard-errors on `[[clang::lifetimebound]]` applied to a parameter of a
        # void-returning function (tg_owt's abseil copy). This is the same patch
        # `scripts/setup_build_env.sh` applies; it is a static-analysis annotation only.
        run: |
          set -euo pipefail
          ATTRS="submodules/tg_owt/src/third_party/abseil-cpp/absl/base/attributes.h"
          if [ -f "$ATTRS" ]; then
            /usr/bin/sed -i '' \
              -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND \[\[clang::lifetimebound\]\]|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' \
              -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND __attribute__((lifetimebound))|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' \
              "$ATTRS"
          fi

      - name: Apply the Xcode 27 deployment-target patch when needed
        run: |
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/.*Xcode ([0-9]+).*/\1/')
          echo "Xcode major version: $MAJOR"
          if [ "$MAJOR" -ge 27 ]; then
            sh scripts/xcode27.sh apply
          else
            echo "Xcode $MAJOR builds the project as is"
          fi

      - name: Cache the native libraries
        # The native libraries (WebRTC, ffmpeg, the Rust engines) take the longest to build and do
        # not depend on the app's Swift sources, so they are cached between runs. The build script
        # checks its own stamp files and skips a library whose outputs are already up to date.
        uses: actions/cache@v4
        with:
          path: |
            core-xprojects/*/build
          key: native-libs-${{ runner.os }}-${{ hashFiles('core-xprojects/**/build.sh', 'scripts/framework-inputs.sh', 'scripts/configure_frameworks.sh') }}
          restore-keys: |
            native-libs-${{ runner.os }}-

      - name: Build the native libraries
        run: sh scripts/configure_frameworks.sh

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Telegram-Mac.xcworkspace \
            -scheme Telegram \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 200
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" != "0" ]; then
            echo "xcodebuild failed with status $STATUS" >&2
            grep -n "error:" "$RUNNER_TEMP/xcodebuild.log" | head -50 >&2 || true
            exit "$STATUS"
          fi

      - name: Collect the app bundle
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "Telegram.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "Telegram.app was not produced" >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 >&2 || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/artifact"
          # The app bundle is signed ad-hoc below so it can be launched on the user's Mac.
          codesign --force --deep --sign - "$APP" || true
          ditto "$APP" "$RUNNER_TEMP/artifact/Telegram.app"
          tar -C "$RUNNER_TEMP/artifact" -czf "$RUNNER_TEMP/Telegram-macOS-build.tar.gz" Telegram.app
          ls -lh "$RUNNER_TEMP/Telegram-macOS-build.tar.gz"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-macOS-build
          path: ${{ runner.temp }}/Telegram-macOS-build.tar.gz
          if-no-files-found: error
          retention-days: 14
